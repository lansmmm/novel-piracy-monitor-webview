<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打盗全家捅</title>
<style>
  /* ==================== 变量 ==================== */
  :root {
    --primary: #2A9D8F;          /* 主色：按钮、强调 */
    --primary-soft: #E8F5F3;     /* 主色浅底：次级按钮 */
    --primary-soft-fg: #1F6B60;  /* 主色浅底上的字色 */
    --bg: #F0F2F5;               /* 页面背景 */
    --card: #FFFFFF;             /* 卡片 */
    --radius: 8px;
    --radius-sm: 6px;
    --text: #2F3542;
    --text-dim: #7A869A;
    --muted: #9AA5B1;
    --disabled-bg: #ECEFF1;
    --border: #E8EBEE;
    --input-bg: #F7F8FA;
    --line: #F0F2F5;             /* 表格行分隔线 */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 12px;                /* 同 Flet page.padding=12 */
    background: var(--bg);
    color: var(--text);
    font-family: "HarmonyOS Sans SC", "HarmonyOS Sans", "Microsoft YaHei UI",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;                     /* 同 Flet page.spacing=8 */
  }

  /* ==================== 卡片 ==================== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 8px;                 /* 同 Flet card() padding=8 */
    width: 100%;
    flex: 0 0 auto;
    /* 窗口太窄时整行可横向滚动，避免按钮被裁掉 */
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* 表格卡：吃掉剩余高度，其余卡片高度固定 */
  .card.grow {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* 卡片内的浅灰分隔线（卡A：顶栏 / 来源 / 书签 之间） */
  .hdiv {
    height: 1px;
    background: var(--line);
    margin: 6px 0;
    flex: 0 0 auto;
  }

  /* ==================== 通用行 ==================== */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .row.tight { gap: 6px; }

  .spacer { flex: 1 1 auto; }

  /* ==================== 按钮 ==================== */
  .btn {
    height: 40px;
    padding: 0 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .btn-primary { background: var(--primary); color: #FFFFFF; }

  /* 保存为书签 */
  .btn-soft { background: var(--primary-soft); color: var(--primary-soft-fg); }

  /* 清 cookies */
  .btn-soft-green { background: var(--primary-soft); color: var(--primary); }

  /* 停止 / 我已过验证，继续（当前都是禁用态） */
  .btn-disabled { background: var(--disabled-bg); color: var(--muted); }

  /* 停止按钮「启用」时的红色 */
  .btn-danger { background: #E63946; color: #FFFFFF; }

  .btn:disabled,
  .btn-sm:disabled,
  .btn-xs:disabled { cursor: not-allowed; }

  /* 纯文字按钮：来源行的「全选 / 取消」 */
  .btn-text {
    height: 28px;
    padding: 0 8px;
    border: none;
    background: transparent;
    color: var(--primary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 400;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  /* 工具栏小按钮：高 28、字号 12 */
  .btn-sm {
    height: 28px;
    padding: 0 10px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--primary-soft);
    color: var(--primary-soft-fg);
    font-family: inherit;
    font-size: 12px;
    font-weight: 400;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .btn-sm-green { background: var(--primary); color: #FFFFFF; }
  .btn-sm-gray  { background: var(--disabled-bg); color: #455A64; }

  /* 工具栏竖线：1px 高 20，左右各 6px */
  .sep {
    width: 1px;
    height: 20px;
    background: #D0D5DD;
    margin: 0 6px;
    flex: 0 0 auto;
  }

  /* ==================== 输入框 ==================== */
  .input {
    height: 40px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    flex: 0 0 auto;
  }

  .input::placeholder { color: var(--muted); }

  .input-book   { width: 240px; }
  .input-pages  { width: 48px; height: 32px; padding: 0 4px; font-size: 12px;
                  text-align: center; background: #FFFFFF; }
  .input-search { width: 220px; height: 32px; padding: 0 6px; font-size: 12px;
                  background: #FFFFFF; flex: 0 1 220px; min-width: 96px; }

  /* ==================== 文字标签 ==================== */
  .label      { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .label-main { font-size: 14px; color: var(--text); white-space: nowrap; }

  /* ==================== 小开关 ==================== */
  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
    flex: 0 0 auto;
  }

  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }

  .switch .track {
    position: absolute;
    inset: 0;
    background: #CFD8DC;
    border-radius: 999px;
    transition: background .15s;
  }

  .switch .track::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 2px;
    top: 2px;
    background: #FFFFFF;
    border-radius: 50%;
    transition: transform .15s;
  }

  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track::before { transform: translateX(16px); }

  /* ==================== 书签胶囊 ==================== */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 3px 12px;
    border-radius: 14px;
    background: var(--disabled-bg);
    color: var(--text-dim);
  }

  .chip .chip-name  { font-size: 13px; font-weight: 700; }
  .chip .chip-count { font-size: 12px; margin-left: 8px; }
  .chip .chip-arrow { font-size: 9px;  margin-left: 4px;
                      padding: 2px 4px; border-radius: 4px; }

  /* ==================== 来源勾选框 ==================== */
  .check {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .check input {
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: var(--primary);
  }

  /* ==================== 表格 ==================== */
  .table-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }

  .table-inner { min-width: 1190px; }

  .table-head {
    display: flex;
    background: var(--input-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .th {
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
  }

  .table-row {
    display: flex;
    border-bottom: 1px solid var(--line);   /* 每行底部浅灰分隔线 */
  }

  .td {
    padding: 8px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 表格里的 url 列：蓝色可点链接 */
  .row-link {
    color: #1A73E8;
    text-decoration: none;
  }

  .row-link:hover { text-decoration: underline; }

  /* 列宽（表头 / 数据行共用） */
  .col-src    { flex: 0 0 80px;  width: 80px; }
  .col-title  { flex: 0 0 320px; width: 320px; }
  .col-date   { flex: 0 0 110px; width: 110px; }
  .col-abs    { flex: 0 0 380px; width: 380px; }
  .col-url    { flex: 0 0 260px; width: 260px; }
  .col-menu   { flex: 0 0 40px;  width: 40px; }

  /* ==================== 来源页签 ==================== */
  .tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    overflow-x: auto;
  }

  .tab {
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .tab.active {
    color: var(--primary);
    font-weight: 700;
    border-top: 2px solid var(--primary);
  }

  /* ==================== 日志区 ==================== */
  .log {
    height: 180px;
    background: #1E272E;
    border-radius: var(--radius);
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;             /* 滚动交给 .log-body */
  }

  /* 日志区右上角的小工具条（开始 / 停止心跳） */
  .log-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding: 6px 8px;
    background: #1E272E;
  }

  .log-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 8px 8px;
  }

  .log-line {
    font-size: 12px;
    line-height: 1.5;
    color: #E8F0F2;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: Consolas, "HarmonyOS Sans SC", "Microsoft YaHei UI", monospace;
  }

  .log-line.alert { color: #FF6B6B; }

  /* 日志区小按钮：高 22、字号 12 */
  .btn-xs {
    height: 22px;
    padding: 0 10px;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 400;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .btn-xs-green { background: var(--primary); color: #FFFFFF; }
  .btn-xs-gray  { background: var(--disabled-bg); color: #455A64; }

  /* ==================== 验证码弹窗 ==================== */
  /* 前台模式撞验证码时由 Python 调 window.showCaptchaDialog(reason) 唤起 */
  .mask {
    position: fixed;
    inset: 0;                     /* 铺满整个窗口 */
    background: rgba(0, 0, 0, 0.45);
    display: none;                /* 默认藏起来，.show 时才显示 */
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .mask.show { display: flex; }

  .dialog {
    width: 420px;
    background: #FFFFFF;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    padding: 18px 20px 16px;
  }

  .dialog-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .dialog-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-dim);
    word-break: break-all;
    margin-bottom: 16px;
  }

  .dialog-btns {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>
</head>
<body>

<!-- ============ 卡A：顶栏 + 搜索来源 + 书签区 ============ -->
<section class="card">
  <div class="row">
    <input id="bookInput" class="input input-book" type="text" placeholder="输入书名">
    <button id="btnSearch" class="btn btn-primary">搜索</button>
    <div class="row" style="gap:2px">
      <span class="label">页数</span>
      <input id="pagesInput" class="input input-pages" type="text" placeholder="自动">
    </div>
    <button id="btnBookmark" class="btn btn-soft">保存为书签</button>
    <button id="btnStop" class="btn btn-disabled" disabled>停止</button>
    <button id="btnCaptchaContinue" class="btn btn-disabled">我已过验证，继续</button>
    <span class="spacer"></span>
    <button id="btnClearCookies" class="btn btn-soft-green">清 cookies</button>
  </div>

  <div class="hdiv"></div>

  <!-- 【2】搜索来源 -->
  <div class="row tight">
    <button id="btnToggleSources" class="btn-text">全选 / 取消</button>
    <label class="check"><input type="checkbox" name="source" value="quark">夸克</label>
    <label class="check"><input type="checkbox" name="source" value="baidu">百度</label>
    <label class="check"><input type="checkbox" name="source" value="zhidao">知道</label>
    <label class="check"><input type="checkbox" name="source" value="tieba">贴吧</label>
    <label class="check"><input type="checkbox" name="source" value="bing">必应</label>
    <label class="check"><input type="checkbox" name="source" value="toutiao">头条</label>
    <label class="check"><input type="checkbox" name="source" value="sogou">搜狗</label>
    <label class="check"><input type="checkbox" name="source" value="so360">360</label>
    <label class="check"><input type="checkbox" name="source" value="sogou_weixin">微信</label>
    <label class="check"><input type="checkbox" name="source" value="weibo">微博</label>
    <span class="spacer"></span>
    <span class="label-main">前台模式</span>
    <label class="switch"><input id="switchFrontend" type="checkbox"><span class="track"></span></label>
    <span style="width:12px"></span>
    <span class="label-main">深度模式</span>
    <label class="switch"><input id="switchDeep" type="checkbox"><span class="track"></span></label>
  </div>

  <div class="hdiv"></div>

  <!-- 【3】书签区 -->
  <div id="bookmarkRow" class="chips">
    <span class="chip"><span class="chip-name">斗破苍穹</span><span class="chip-count">5</span><span class="chip-arrow">▼</span></span>
    <span class="chip"><span class="chip-name">纯白恶魔</span><span class="chip-count">1</span><span class="chip-arrow">▼</span></span>
  </div>
</section>

<!-- ============ 卡B：工具栏 + 结果表格 + 来源页签 ============ -->
<section class="card grow">
  <div class="row tight">
    <button id="btnTbSelectAll" class="btn-sm">全选/取消</button>
    <span class="sep"></span>
    <button id="btnTbOpen" class="btn-sm">批量打开</button>
    <button id="btnTbCopy" class="btn-sm">批量复制</button>
    <span class="sep"></span>
    <button id="btnTbWhite" class="btn-sm btn-sm-green">加白名单</button>
    <button id="btnTbWhiteWords" class="btn-sm btn-sm-green">白名单词</button>
    <button id="btnTbResetWhite" class="btn-sm btn-sm-green">重置白名单</button>
    <span class="sep"></span>
    <button id="btnTbHistory" class="btn-sm">载入历史数据</button>
    <button id="btnTbExport" class="btn-sm btn-sm-green">导出结果</button>
    <button id="btnTbClear" class="btn-sm btn-sm-gray">清空列表</button>
    <span class="spacer"></span>
    <input id="tableSearchInput" class="input input-search" type="text"
           placeholder="筛选标题/摘要/链接">
    <button id="btnTbSearchClear" class="btn-sm btn-sm-gray">清空</button>
  </div>

  <!-- 【5】结果表格 -->
  <div class="table-scroll">
    <div class="table-inner">
      <div class="table-head">
        <div class="th col-src">来源</div>
        <div class="th col-title">标题</div>
        <div class="th col-date">日期</div>
        <div class="th col-abs">摘要</div>
        <div class="th col-url">最终 url</div>
        <div class="th col-menu"></div>
      </div>
      <!-- 数据行稍后追加：<div class="table-row">…</div>（每行底部自带浅灰分隔线） -->
      <div id="tableBody"></div>
    </div>
  </div>

  <!-- 【6】来源页签 -->
  <div id="tabs" class="tabs">
    <span class="tab active">全部</span>
    <span class="tab">夸克</span>
    <span class="tab">百度</span>
    <span class="tab">知道</span>
    <span class="tab">贴吧</span>
    <span class="tab">必应</span>
    <span class="tab">头条</span>
    <span class="tab">搜狗</span>
    <span class="tab">360</span>
    <span class="tab">微信</span>
    <span class="tab">微博</span>
    <span class="tab">文心</span>
  </div>
</section>

<!-- ============ 卡C：日志区 ============ -->
<section class="log" id="log">
  <!-- 右上角工具条：第 3 步链路验证用的模拟心跳 -->
  <div class="log-bar">
    <button id="btnHeartbeatStart" class="btn-xs btn-xs-green">开始心跳</button>
    <button id="btnHeartbeatStop" class="btn-xs btn-xs-gray">停止心跳</button>
  </div>
  <div class="log-body" id="logBody"></div>
</section>

<!-- ============ 验证码遮罩弹窗（前台模式撞验证码时由 Python 唤起） ============ -->
<div id="captchaDialog" class="mask">
  <div class="dialog">
    <div class="dialog-title">需要过验证码</div>
    <div id="captchaText" class="dialog-text"></div>
    <div class="dialog-btns">
      <button id="btnCaptchaStop" class="btn btn-soft">停止本轮</button>
      <button id="btnCaptchaOk" class="btn btn-primary">我已过验证，继续</button>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   批 1-1：搜索启动骨架
   - Python 侧用 window.evaluate_js("window.appendLog('...')") 主动推送
   - 本文件负责：收集界面输入 → 校验 → 调 start_search；并接收 setSearching
     / appendLog 两个 Python 回调把界面画出来
   ====================================================================== */
(function () {
  'use strict';

  var logBody = document.getElementById('logBody');
  var tableBody = document.getElementById('tableBody');
  var tableScroll = document.querySelector('.table-scroll');
  var bookInput = document.getElementById('bookInput');
  var pagesInput = document.getElementById('pagesInput');
  var btnSearch = document.getElementById('btnSearch');
  var btnSearchStop = document.getElementById('btnStop');
  var btnHbStart = document.getElementById('btnHeartbeatStart');
  var btnHbStop = document.getElementById('btnHeartbeatStop');

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function nowStamp() {
    var d = new Date();
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  /* Python 调用的入口：追加一行日志并滚到底部 */
  window.appendLog = function (text) {
    var line = document.createElement('div');
    line.className = 'log-line';

    var msg = (text === null || text === undefined) ? '' : String(text);

    // 文本里已经带 [HH:MM:SS] 前缀就不重复加
    if (/^\[\d{2}:\d{2}:\d{2}\]/.test(msg)) {
      line.textContent = msg;
    } else {
      line.textContent = '[' + nowStamp() + '] ' + msg;
    }

    if (msg.indexOf('[暂停]') !== -1) { line.classList.add('alert'); }

    logBody.appendChild(line);
    logBody.scrollTop = logBody.scrollHeight;   // 自动滚到最新一行
    return logBody.children.length;
  };

  /* ======================================================================
     Python 调用的入口：往结果表格追加一行
     Python 侧：window.evaluate_js('window.appendRow({...})')
     这里收到的是一段 JSON 字符串，自己 parse
     列宽跟表头一致：来源 80 / 标题 320 / 日期 110 / 摘要 380 / url 260 / 菜单 40
     ====================================================================== */
  window.appendRow = function (jsonStr) {
    var r = {};
    try {
      r = JSON.parse(jsonStr) || {};
    } catch (e) {
      r = { source: '', title: String(jsonStr), date: '未知', summary: '', url: '' };
    }

    var row = document.createElement('div');
    row.className = 'table-row';

    row.appendChild(makeCell('来源', 'td col-src', r.source));
    row.appendChild(makeCell('标题', 'td col-title', r.title));
    row.appendChild(makeCell('日期', 'td col-date', r.date));
    row.appendChild(makeCell('摘要', 'td col-abs', r.summary));
    row.appendChild(makeUrlCell(r.url));

    var menu = document.createElement('div');
    menu.className = 'td col-menu';
    menu.textContent = '⋯';
    row.appendChild(menu);

    tableBody.appendChild(row);

    // 自动滚到底部（滚动条在外层 .table-scroll 上）
    if (tableScroll) { tableScroll.scrollTop = tableScroll.scrollHeight; }

    return tableBody.children.length;
  };

  /* 普通单元格：整格 ellipsis 截断，鼠标悬停看全文 */
  function makeCell(label, cls, value) {
    var cell = document.createElement('div');
    cell.className = cls;
    var text = (value === null || value === undefined) ? '' : String(value);
    cell.textContent = text;
    cell.title = text;                       // 悬停显示完整内容
    cell.setAttribute('data-label', label);
    return cell;
  }

  /* url 单元格：蓝色可点链接（空白 / 非 http 就按纯文本显示）
     ★ 点击走 Python 的 webbrowser.open，不让 WebView 内部跳转：
       href 用 javascript:void(0)（不真实导航），真正的打开动作在 click 监听里。
       用 addEventListener 而不是内联 onclick，是因为 url 里可能带单引号，
       拼字符串会直接把属性拼坏。 */
  function makeUrlCell(url) {
    var cell = document.createElement('div');
    cell.className = 'td col-url';
    var text = (url === null || url === undefined) ? '' : String(url);
    cell.title = text;

    if (/^https?:\/\//i.test(text)) {
      var a = document.createElement('a');
      a.className = 'row-link';
      a.href = 'javascript:void(0)';
      a.textContent = text;
      a.addEventListener('click', function () {
        if (apiReady()) { window.pywebview.api.open_url(text); }
      });
      cell.appendChild(a);
    } else {
      cell.textContent = text;
    }
    return cell;
  }

  function apiReady() {
    return !!(window.pywebview && window.pywebview.api);
  }

  /* ==================== 搜索中状态切换 ==================== */
  /* Python 侧搜完/开跑时会调 window.setSearching(true/false) */
  window.setSearching = function (isSearching) {
    var on = !!isSearching;

    // 搜索按钮：搜索中 → 灰掉禁用
    btnSearch.disabled = on;
    btnSearch.classList.toggle('btn-primary', !on);
    btnSearch.classList.toggle('btn-disabled', on);

    // 停止按钮：搜索中 → 亮红可点
    btnSearchStop.disabled = !on;
    btnSearchStop.classList.toggle('btn-disabled', !on);
    btnSearchStop.classList.toggle('btn-danger', on);

    return on;
  };

  /* ==================== 读取界面输入 ==================== */
  function getCheckedSources() {
    var boxes = document.querySelectorAll('input[name="source"]:checked');
    return Array.prototype.slice.call(boxes).map(function (el) { return el.value; });
  }

  function getPagesArg() {
    var raw = (pagesInput.value || '').trim();
    if (raw === '') { return 'auto'; }                       // 留空 = 自动
    if (/^\d+$/.test(raw)) { return parseInt(raw, 10); }     // 纯数字 → int
    return raw;                                              // 其他原样交给后端
  }

  /* ==================== 搜索 / 停止 ==================== */
  btnSearch.addEventListener('click', function () {
    var book = (bookInput.value || '').trim();
    var sources = getCheckedSources();
    var pages = getPagesArg();

    if (!book) { window.appendLog('[提示] 请先输入书名'); return; }
    if (!sources.length) { window.appendLog('[提示] 请至少勾选一个来源'); return; }
    if (!apiReady()) { window.appendLog('[错误] pywebview.api 还没就绪'); return; }

    window.pywebview.api.start_search(book, sources, pages).then(function (res) {
      if (res === 'already_running') {
        window.appendLog('[提示] 上一次搜索还在跑，请稍候');
      }
    });
  });

  btnSearchStop.addEventListener('click', function () {
    window.appendLog('收到停止指令');
    // 不在这里 setSearching(false)：等后台线程真的退出后，由 Python 的
    // finally 统一调 setSearching(false)，否则按钮先恢复但线程还在跑，
    // 用户会以为已经停了。
    if (apiReady()) { window.pywebview.api.stop_search(); }
  });

  /* ==================== 心跳（链路验证用） ==================== */
  btnHbStart.addEventListener('click', function () {
    if (!apiReady()) { window.appendLog('[错误] pywebview.api 还没就绪'); return; }
    window.pywebview.api.start_heartbeat();
  });

  btnHbStop.addEventListener('click', function () {
    if (!apiReady()) { window.appendLog('[错误] pywebview.api 还没就绪'); return; }
    window.pywebview.api.stop_heartbeat();
  });

  /* ==================== 验证码弹窗 ==================== */
  /* Python 调：window.showCaptchaDialog('搜狗风控（HTTP 403）…') */
  var captchaDialog = document.getElementById('captchaDialog');
  var captchaText = document.getElementById('captchaText');
  var btnCaptchaOk = document.getElementById('btnCaptchaOk');
  var btnCaptchaStop = document.getElementById('btnCaptchaStop');
  var btnCaptchaContinueTop = document.getElementById('btnCaptchaContinue');

  function hideCaptchaDialog() {
    captchaDialog.classList.remove('show');
  }

  window.showCaptchaDialog = function (reason) {
    var text = (reason === null || reason === undefined) ? '' : String(reason);
    captchaText.textContent = text;
    captchaDialog.classList.add('show');
    try { window.focus(); } catch (e) { /* 某些环境下会抛，忽略 */ }
    return true;
  };

  /* 「我已过验证，继续」：通知 Python 唤醒暂停中的线程，并收起弹窗 */
  function onCaptchaContinue() {
    if (apiReady()) { window.pywebview.api.captcha_continue(); }
    hideCaptchaDialog();
  }

  /* 「停止本轮」：跟顶栏「停止」同一个动作（顺带把卡在等验证的线程唤醒） */
  function onCaptchaStop() {
    window.appendLog('收到停止指令');
    if (apiReady()) { window.pywebview.api.stop_search(); }
    hideCaptchaDialog();
  }

  btnCaptchaOk.addEventListener('click', onCaptchaContinue);
  btnCaptchaStop.addEventListener('click', onCaptchaStop);
  /* 顶栏那条「我已过验证，继续」= 弹窗里的继续按钮 */
  btnCaptchaContinueTop.addEventListener('click', onCaptchaContinue);

  /* ==================== 前台 / 深度 两个开关 ==================== */
  var switchFrontend = document.getElementById('switchFrontend');
  var switchDeep = document.getElementById('switchDeep');

  switchFrontend.addEventListener('change', function () {
    var on = !!switchFrontend.checked;
    window.appendLog('前台模式：' + (on ? '开（显示浏览器 + 验证码弹窗）' : '关（后台无头，不弹窗）'));
    if (apiReady()) { window.pywebview.api.set_frontend_mode(on); }
  });

  switchDeep.addEventListener('change', function () {
    var on = !!switchDeep.checked;
    window.appendLog('深度模式：' + (on ? '开（PC + 移动端一起搜）' : '关（每个来源只搜主渠道）'));
    if (apiReady()) { window.pywebview.api.set_deep_mode(on); }
  });

  /* 初始状态：搜索按钮可用、停止按钮禁用 */
  window.setSearching(false);
})();
</script>

</body>

</html>
